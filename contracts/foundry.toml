[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 1
via_ir = false
fs_permissions = [{ access = "read", path = "../circuit/target" }, { access = "read", path = "./test/fixtures" }]

[lint]
lint_on_build = false

# HonkVerifier.sol is generated by `bb write_solidity_verifier`; keep it byte-identical
# so `npm run check:verifier` can diff it.
[fmt]
ignore = ["src/HonkVerifier.sol"]
